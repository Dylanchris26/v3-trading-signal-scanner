name: V2 30-Day Validation (3 x 10-Day)

on:
  workflow_dispatch:

jobs:
  backtest:
    name: 10-day window (end offset ${{ matrix.offset_label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        offset_label: [7 days, 17 days, 27 days]
        offset_minutes: [10080, 24480, 38880]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install git+https://github.com/iqoptionapi/iqoptionapi.git

      - name: Verify files
        run: |
          ls -la

      - name: Run 10-day V2 backtest
        env:
          IQ_EMAIL: ${{ secrets.IQ_EMAIL }}
          IQ_PASSWORD: ${{ secrets.IQ_PASSWORD }}
          BACKTEST_MINUTES: "14400"
          BACKTEST_END_OFFSET_MINUTES: ${{ matrix.offset_minutes }}
        run: |
          echo "Testing 10 days ending ${{ matrix.offset_label }} before current server time"
          python backtest_v2_30d.py
