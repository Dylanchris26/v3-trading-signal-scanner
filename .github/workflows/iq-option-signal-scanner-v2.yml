name: IQ Option Practice Signal Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      IQ_EMAIL: ${{ secrets.IQ_EMAIL }}
      IQ_PASSWORD: ${{ secrets.IQ_PASSWORD }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      ACCOUNT_MODE: PRACTICE
      AUTO_TRADE: "False"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir             "git+https://github.com/iqoptionapi/iqoptionapi.git@8a903cc"             requests numpy pandas scikit-learn

      - name: Compile scanner
        run: python -m py_compile scanner.py

      - name: Run scanner
        run: python scanner.py

      - name: Save learning state
        run: |
          if [ -f vetrax_learning_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add vetrax_learning_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update VETRA-X learning state"
              git push
            else
              echo "No learning-state changes to save."
            fi
          else
            echo "No learning state file was created."
          fi
