name: IQ Option Practice Signal Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '*/2 * * * *'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      IQ_EMAIL: ${{ secrets.IQ_EMAIL }}
      IQ_PASSWORD: ${{ secrets.IQ_PASSWORD }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      ACCOUNT_MODE: PRACTICE
      AUTO_TRADE: 'False'
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout bot
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          

      - name: Install pinned IQ Option API dependency
        run: |
          python -m pip install --upgrade pip
          # Pin the last published upstream release instead of accepting an
          # arbitrary package from PyPI. The project documents 7.1.1 as its
          # latest release and publishes the tag/commit 8a903cc.
          python -m pip install --no-cache-dir \
            'git+https://github.com/iqoptionapi/iqoptionapi.git@8a903cc'
          python -m pip install --no-cache-dir requests

      - name: Apply signal-only Digital hardening to installed iqoptionapi
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import importlib.util
          import re

          spec = importlib.util.find_spec("iqoptionapi.stable_api")
          if spec is None or spec.origin is None:
              raise SystemExit("iqoptionapi.stable_api was not installed")

          path = Path(spec.origin)
          text = path.read_text(encoding="utf-8")

          # This build is signal-only. We deliberately keep stable_api
          # available for compatibility, but make get_all_open_time() ignore
          # the optional Digital-underlying endpoint. That endpoint is the
          # source of the known 30-second timeout/None dereference.
          marker = 'digital_data = self.get_digital_underlying_list_data()["underlying"]'
          if marker in text:
              text = text.replace(
                  marker,
                  'digital_data = []  # Digital disabled for this signal-only build'
              )
          else:
              # Also support versions whose formatting differs slightly.
              pattern = r'digital_data\s*=\s*self\.get_digital_underlying_list_data\(\)\["underlying"\]'
              text2, count = re.subn(
                  pattern,
                  'digital_data = []  # Digital disabled for this signal-only build',
                  text,
                  count=1,
              )
              if count:
                  text = text2

          path.write_text(text, encoding="utf-8")
          print(f"Hardened: {path}")
          PY

      - name: Verify dependency hardening before startup
        run: |
          python - <<'PY'
          import importlib.util
          import iqoptionapi
          import iqoptionapi.stable_api as stable_api
          from pathlib import Path

          spec = importlib.util.find_spec("iqoptionapi.stable_api")
          source = Path(spec.origin).read_text(encoding="utf-8")
          if 'get_digital_underlying_list_data()["underlying"]' in source:
              raise SystemExit("FAIL: Digital underlying call is still active in stable_api.py")
          print("PASS: stable_api Digital-underlying call is disabled for this build.")
          print("iqoptionapi module:", iqoptionapi.__file__)
          print("stable_api module:", spec.origin)
          PY

      - name: Dependency smoke test — get_all_open_time cannot enter Digital
        run: |
          python - <<'PY'
          import iqoptionapi.stable_api as stable_api

          # Test the exact failure boundary without connecting to IQ Option.
          # If get_all_open_time() tries to call the Digital endpoint, this
          # test fails immediately.
          client = stable_api.IQ_Option.__new__(stable_api.IQ_Option)
          client.suspend = 0
          client.get_all_init_v2 = lambda: {
              "binary": {"actives": {"1": {
                  "name": "binary.EURUSD",
                  "enabled": True,
                  "is_suspended": False,
              }}},
              "turbo": {"actives": {"1": {
                  "name": "turbo.EURUSD",
                  "enabled": True,
                  "is_suspended": False,
              }}},
          }
          client.get_instruments = lambda _kind: {"instruments": []}

          def digital_must_not_run():
              raise AssertionError("Digital underlying endpoint was called")

          client.get_digital_underlying_list_data = digital_must_not_run

          result = client.get_all_open_time()
          assert result["binary"]["EURUSD"]["open"] is True
          assert result["turbo"]["EURUSD"]["open"] is True
          assert "digital" not in result or not result["digital"]
          print("PASS: get_all_open_time() completed without Digital.")
          PY

      - name: Compile scanner.py
        run: python -m py_compile scanner.py

      - name: Verify scanner safety invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          path = Path("scanner.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source, filename="scanner.py")

          required = {
              'ACCOUNT_MODE = "PRACTICE"': 'ACCOUNT_MODE = "PRACTICE"' in source,
              'AUTO_TRADE = False': 'AUTO_TRADE = False' in source,
              'MAX_DAILY_SIGNALS = 4': 'MAX_DAILY_SIGNALS = 4' in source,
              'entrypoint': 'if __name__ == "__main__":' in source,
          }
          failed = [k for k, ok in required.items() if not ok]
          if failed:
              raise SystemExit("Missing scanner safety invariant(s): " + ", ".join(failed))

          

          print("PASS: scanner.py safety invariants and AST checks.")
          PY
- name: Test Telegram
  run: |
    python - <<'PY'
    import os
    import requests

    token = os.environ["BOT_TOKEN"]
    chat_id = os.environ["CHAT_ID"]

    url = f"https://api.telegram.org/bot{token}/sendMessage"
    response = requests.post(
        url,
        json={
            "chat_id": chat_id,
            "text": "✅ IQ Option scanner Telegram test is working."
        },
        timeout=20,
    )

    print(response.text)
    response.raise_for_status()
    PY
      - name: Run signal scanner
        run: python scanner.py
